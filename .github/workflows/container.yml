name: Promote container release

# Images are built/tested locally. This job only promotes an existing digest,
# avoiding repeated multi-GB SDK builds and a GPU matrix on hosted runners.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Verified image digest (sha256:...) already pushed to GHCR'
        required: true
        type: string
      version:
        description: 'Release version, for example 0.2.2'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release inputs
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote tested image
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create --prefer-index=false \
            --tag "$image:$VERSION" --tag "$image:stable" "$image@$DIGEST"
