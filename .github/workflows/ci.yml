name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Validate scripts
        run: bash -n scripts/*.sh
      - name: Build frontend
        run: npm ci --prefix ui && npm run build --prefix ui
      - name: Test Rust bridge
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml --locked
